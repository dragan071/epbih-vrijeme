<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ELEKTROPRIVREDA BROJILO</title>
<style>
  body {
    font-family: "Segoe UI", "San Francisco", "Helvetica Neue", "Ubuntu", "Arial", sans-serif;
    padding: 10px;
    margin: 0;
  }
  h1 {
    text-align: center;
    font-size: 10vw;
    margin: 10px 0;
    margin-bottom: 40px;
  }
  .time-box {
    font-size: 8vw;
    font-weight: bold;
    margin: 15px auto;
    padding: 20px;
    max-width: 95%;
    text-align: center;
    border-radius: 12px;
    border: 2px solid #ccc;
    line-height: 1.4;
  }
  .green {
    background-color: lightgreen;
  }
  .red {
    background-color: lightcoral;
  }

  /* Za desktop ekrane */
  @media (min-width: 768px) {
    h1 {
      font-size: 50px;
    }
    .time-box {
      font-size: 40px;
      max-width: 600px;
    }
  }
</style>
</head>
<body>
    <h1>Elektroprivreda - brojilo</h1>

<div id="currentTime" class="time-box"></div>
<div id="futureTime" class="time-box"></div>
<div id="historicalDate" class="time-box"></div>

<script>
function pad(n) {
  return n.toString().padStart(2, '0');
}

function updateTimes() {
  const now = new Date();

  // Current time
  const hours = now.getHours();
  const minutes = now.getMinutes();
  const currentTimeStr = pad(hours) + ':' + pad(minutes);

  // Display current time (no formatting)
  const currentDiv = document.getElementById('currentTime');
  currentDiv.innerHTML = 'Trenutno vrijeme:<br>' + currentTimeStr;
  currentDiv.className = 'time-box';

  // Detect DST: meter clock doesn't observe DST, so offset changes
  const jan = new Date(now.getFullYear(), 0, 1);
  const isDST = now.getTimezoneOffset() < jan.getTimezoneOffset();
  const meterOffsetMinutes = isDST ? 17 : 77; // 0h17m in summer, 1h17m in winter
  const offsetLabel = isDST ? '0h17m' : '1h17m';

  const future = new Date(now.getTime() + meterOffsetMinutes * 60000);
  const futureHours = future.getHours();
  const futureMinutes = future.getMinutes();
  const futureTimeStr = pad(futureHours) + ':' + pad(futureMinutes);

  // Apply conditional formatting only to second box
  function getColor(h) {
    if ((h >= 13 && h < 16) || (h >= 22 || h < 6)) {
      return 'green';
    }
    return 'red';
  }

  const futureColor = getColor(futureHours);

  const futureDiv = document.getElementById('futureTime');
  futureDiv.innerHTML = 'Vrijeme na satu: (' + offsetLabel + '):<br>' + futureTimeStr;
  futureDiv.className = 'time-box ' + futureColor;

  // Historical date: 10 years ago, adjusted to show the same day of week as today
  const historicalBase = new Date(now);
  historicalBase.setFullYear(historicalBase.getFullYear() - 10);
  const nowDay = now.getDay();
  const baseDay = historicalBase.getDay();
  const dayShift = ((nowDay - baseDay) + 7) % 7;
  const daysToSubtract = (7 - dayShift) % 7;
  const historicalDate = new Date(historicalBase);
  historicalDate.setDate(historicalDate.getDate() - daysToSubtract);

  const dayNames = ['Nedjelja', 'Ponedjeljak', 'Utorak', 'Srijeda', 'Četvrtak', 'Petak', 'Subota'];
  const monthNames = ['siječnja', 'veljače', 'ožujka', 'travnja', 'svibnja', 'lipnja',
                      'srpnja', 'kolovoza', 'rujna', 'listopada', 'studenog', 'prosinca'];

  const dayOfWeek = dayNames[historicalDate.getDay()];
  const day = historicalDate.getDate();
  const month = monthNames[historicalDate.getMonth()];
  const year = historicalDate.getFullYear();

  const historicalDiv = document.getElementById('historicalDate');
  historicalDiv.innerHTML = 'Dan:<br>' +
                            dayOfWeek;
  historicalDiv.className = 'time-box';
}

// Update immediately and every minute
updateTimes();
setInterval(updateTimes, 60000);
</script>

</body>
</html>
